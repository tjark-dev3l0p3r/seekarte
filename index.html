<!doctype html>
<html lang="de" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Seekarte Live</title>
<meta name="description" content="Seekarte mit Live-AIS für das Tablet an Bord">
<meta name="theme-color" content="#0f2130">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Seekarte">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" crossorigin="anonymous">
<link rel="stylesheet" href="app.css?v=2.3.0">
</head>
<body>
<div id="map" aria-label="Seekarte"></div>
<canvas id="edge" aria-hidden="true"></canvas>

<!-- Instrumentenleiste -->
<header id="strip">
  <div class="inst" data-k="sog"><span class="cap">Fahrt · SOG</span><span class="num"><b id="vSog">–</b><i id="vSogU">kn</i></span></div>
  <div class="inst" data-k="cog"><span class="cap">Kurs · COG</span><span class="num"><b id="vCog">–</b><i>°</i></span></div>
  <div class="inst opt" data-k="hdg"><span class="cap">Voraus · HDG</span><span class="num"><b id="vHdg">–</b><i>°</i></span></div>
  <div class="inst pos"><span class="cap">Position <em id="vSrc" class="src">–</em></span><span class="coord"><span id="vLat">–</span><span id="vLon">–</span></span></div>
  <button class="inst tide" id="iTide" type="button" hidden><span class="cap" id="tideCap">Tide</span><span class="num"><b id="vTide">–</b><i id="vTideU">m</i></span><small id="vTideSub"></small></button>
  <div class="inst km" id="iKm" hidden><span class="cap">NOK-km</span><span class="num"><b id="vKm">–</b></span></div>
  <div class="grow"></div>
  <button class="chip" id="cAis" type="button"><span class="dot"></span><span id="vAis">AIS</span></button>
  <div class="inst clock opt"><span class="cap">Bordzeit <em id="vTz"></em></span><span class="num"><b id="vTime">–</b></span></div>
</header>

<div id="alert" role="alert" hidden></div>
<div id="toast" role="status" hidden></div>

<!-- Werkzeuge -->
<nav id="rail" aria-label="Werkzeuge">
  <button id="tFollow" class="rb" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.4" class="f"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"/></svg><span>Folgen</span></button>
  <button id="tOrient" class="rb" type="button"><svg viewBox="0 0 24 24" id="orientIco"><path d="M12 3l4.5 10H7.5L12 3Z" class="f"/><path d="M7.5 13 12 21l4.5-8"/></svg><span id="orientLbl">Nord oben</span></button>
  <span class="sep"></span>
  <button id="tList" class="rb" type="button"><svg viewBox="0 0 24 24"><path d="M12 3 18 18 12 15 6 18Z"/><path d="M3 21h18" /></svg><span>Schiffe</span><em id="listBadge" hidden></em></button>
  <button id="tLayers" class="rb" type="button"><svg viewBox="0 0 24 24"><path d="M12 3 2.5 8 12 13l9.5-5L12 3Z"/><path d="m2.5 12.5 9.5 5 9.5-5"/><path d="m2.5 16.5 9.5 5 9.5-5"/></svg><span>Karte</span></button>
  <button id="tTheme" class="rb" type="button"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18Z" class="f"/><circle cx="12" cy="12" r="9"/></svg><span id="themeLbl">Tag</span></button>
  <button id="tMeasure" class="rb" type="button"><svg viewBox="0 0 24 24"><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/><path d="M6.6 17.4 17.4 6.6" stroke-dasharray="2.2 2.2"/></svg><span>Messen</span></button>
  <span class="sep"></span>
  <button id="tSettings" class="rb" type="button"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg><span>Setup</span></button>
  <button id="tMob" class="rb mob" type="button" aria-label="Mann über Bord markieren"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><path d="M12 3.5v4.5M12 16v4.5M3.5 12H8M16 12h4.5"/></svg><span>MOB</span></button>
  <button id="tHelp" class="rb" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .9-1 1.6v.5"/><circle cx="12" cy="16.9" r=".4" class="f"/></svg><span>Hilfe</span></button>
</nav>

<div id="zoom">
  <button id="zIn" class="rb sq" type="button" aria-label="Hineinzoomen"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button id="zOut" class="rb sq" type="button" aria-label="Herauszoomen"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
</div>

<!-- Info unten links: nächstes Schiff / Messung / Tipp-Position -->
<div id="hud">
  <div id="suggest" hidden></div>
  <button id="mobCard" type="button" hidden></button>
  <button id="near" type="button" hidden></button>
  <div id="probe" hidden></div>
</div>

<!-- Seitenfach (Liste, Karte, Setup, Schiff) -->
<aside id="drawer" hidden>
  <div class="dhead"><h2 id="dTitle"></h2><button class="close" type="button" id="dClose" aria-label="Schließen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div id="dBody"></div>
</aside>

<!-- Hilfe & Einrichtung -->
<div id="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><div id="mBody"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js" crossorigin="anonymous"></script>
<script src="app.js?v=2.3.0"></script>
</body>
</html>
